# sops recipient rules. Only PUBLIC age keys go here — safe to commit.
#
# Add a recipient by generating/deriving its public key, adding an anchor
# below, then running `just rekey` so existing secrets are re-encrypted to it.
#   - Personal key:  age-keygen -o ~/.config/sops/age/keys.txt  (see README)
#   - A machine:     just add-machine ~/.ssh/id_ed25519
keys:
  # Replace with your personal age PUBLIC key (the `age1…` line printed by
  # age-keygen). This key is the sops root; its private half is bootstrapped
  # from Bitwarden, never committed. See README.
  - &personal age1f37cvtdhprz0d04vvtjh8kwkxatqa577v39dc9fkxthrgrsgnuvsxuczuf

creation_rules:
  - path_regex: store/.*\.(yaml|json|env)$
    key_groups:
      - age:
          - *personal
